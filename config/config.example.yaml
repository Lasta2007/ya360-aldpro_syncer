# Пример конфигурации модуля синхронизации ALD Pro -> Яндекс 360.
# Скопируйте в /opt/ya360-aldpro_syncer/config/config.yaml и отредактируйте.
# Секреты лучше задавать переменными окружения с префиксом A2Y_ (см. systemd-юнит).

ald_pro:
  # Базовый URL ALD Pro (раздел 1.3.1 «Аутентификация», POST /api/ds/login)
  base_url: "https://aldpro.example.ru/ad"
  login: "svc_sync"                  # сервисная УЗ с правами на чтение каталога
  password: ""                       # лучше задать через A2Y_ALD_PRO_PASSWORD
  verify_ssl: true                   # путь к CA-файлу вместо true, если внутренний сертификат
  timeout: 30.0
  page_size: 500

yandex360:
  oauth_token: ""                    # лучше задать через A2Y_YANDEX360_OAUTH_TOKEN
  org_id: 123456
  api_host: "cloud-api.yandex.net"   # или api360.yandex.net (legacy-пути)
  use_ref_paths: true                # true -> /directory/v1/org/{orgId}/... (раздел ref/*)
  timeout: 30.0
  per_page: 1000
  # Обязательное поле UserService_Create — пароль создаваемого сотрудника:
  initial_password_env: "A2Y_YANDEX360_INITIAL_PASSWORD"
  password_change_required: true

sync:
  base_dn: "OU=Персонал,DC=example,DC=ru"   # корень обхода дерева ALD Pro
  root_department_id: 1                      # id подразделения-родителя в Яндекс 360
  state_path: "/opt/ya360-aldpro_syncer/state/sync_state.json"
  mode: incremental                          # full | incremental
  dry_run: false
  delete_departments: false                  # разрешить DepartmentService_Delete
  on_removed_user: block                     # block | dismiss | none

logging:
  level: INFO                                # DEBUG | INFO | WARNING | ERROR
  file: "/opt/ya360-aldpro_syncer/logs/sync.log"          # пусто/отсутствует -> stdout
